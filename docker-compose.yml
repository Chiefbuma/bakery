services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whiskedelights-app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    working_dir: /app
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - whiskedelights-network

  mysql:
    image: mysql:8.0
    container_name: whiskedelights-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: whiskedelights_local
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: whiskedelights
      MYSQL_PASSWORD: whiskedelights
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - whiskedelights-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: whiskedelights-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - whiskedelights-network

networks:
  whiskedelights-network:
    driver: bridge

volumes:
  app_node_modules:
  dbdata:
